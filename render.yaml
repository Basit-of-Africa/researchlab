# Render Blueprint for the FastAPI backend (free web service).
# Free instances sleep after inactivity and have an ephemeral filesystem:
# STORAGE_BACKEND must be "supabase" so original documents survive restarts.
services:
  - type: web
    name: researchlab-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations run on every start (idempotent); free tier has no pre-deploy hook.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.2"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false          # Neon connection string (postgresql+psycopg://...?sslmode=require)
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        sync: false          # https://<your-app>.vercel.app
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: researchlab
      - key: LLM_PROVIDERS
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: hashing        # or "gemini" (external) — see docs/FREE_TIER_LIMITS.md
      - key: RUN_EMBEDDED_WORKER
        value: "true"
      - key: ANALYSIS_MEMORY_MB
        value: "384"          # free instances have 512 MB RAM
